[package]
name = "qcstatusbar"
version = "0.1.0"
edition = "2021"
description = "QCStatusBar - High-performance Qwen Code StatusLine tool written in Rust"
authors = []
license = "MIT"
keywords = ["qwen", "statusline", "rust", "qwen-code"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
toml = "1.0"
dirs = "6.0"
